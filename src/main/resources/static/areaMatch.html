<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>ÁreaMatch</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="./Style/styleAreaMatch.css">
</head>

<body>
    <header class="navbar bg-warning shadow-sm px-3 py-2">
        <div class="container-fluid d-flex align-items-center">
            <div class="d-flex flex-column align-items-start">
                <a class="navbar-brand fw-bold" href="inicio.html">
                    <img src="imagens/logo.png" alt="LibertyHive" width="40" />
                </a>

<div class="brand-wrap"> <button class="back-btn" onclick="window.location.href='inicio.html'"> Voltar </button> </div>
            </div>

        <div class="flex-grow-1 text-center">
            <h2 class="m-0 fw-bold mt-2">ÁreaMatch - Seus Matches</h2>
        </div>
            <div class="d-flex align-items-center gap-3">
                <button type="button" class="btn btn-outline-danger btn-sm rounded-circle" title="Meus Favoritos"
                    onclick="window.location.href='favoritos.html'">
                    <i class="bi bi-heart"></i>
                </button>

                <button type="button" class="btn btn-outline-dark btn-sm rounded-circle" title="Perfil"
                    onclick="window.location.href='configuracao.html'">
                    <i class="bi bi-person"></i>
                </button>

                <button type="button" class="btn btn-outline-dark btn-sm rounded-circle" onclick="logout()"
                    title="Sair">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </header>
    <main class="content mt-4">
        <div id="matchesContainer" class="text-center">
            <p>Carregando...</p>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer mt-auto">
        <div class="container py-5">
        </div>
    </footer>

    <script src="areaMatch.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
